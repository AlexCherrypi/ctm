# Tells the marketplaces that list this plugin that it changed. Their workflow
# then pins the new commit in marketplace.json, and that push fires the
# webhook that makes claude.ai re-sync.
# Each marketplace needs its own secret: a fine-grained token with
# "Contents: read and write" on that marketplace repo. Without the secret the
# step is skipped; the marketplace still picks the change up with its daily check.
name: Notify marketplaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - marketplace: wemotion-gmbh/claude-plugins
            secret: MARKETPLACE_DISPATCH_TOKEN
          - marketplace: AlexCherrypi/alexcherrypi-plugins
            secret: PERSONAL_MARKETPLACE_DISPATCH_TOKEN
    steps:
      - name: Send repository_dispatch to ${{ matrix.marketplace }}
        env:
          TOKEN: ${{ secrets[matrix.secret] }}
          MARKETPLACE: ${{ matrix.marketplace }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::${{ matrix.secret }} not set – skipping $MARKETPLACE"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$MARKETPLACE/dispatches" \
            -d "{\"event_type\":\"plugin-updated\",\"client_payload\":{\"repo\":\"$GITHUB_REPOSITORY\",\"sha\":\"$GITHUB_SHA\"}}"
